<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f5ef">
    {% seo %}
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
    <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header wrap">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Luiz Facury, home"><span class="monogram" aria-hidden="true">lf.</span><span>Luiz Facury</span></a>
      <nav aria-label="Main navigation">
        <a href="#research">Research</a>
        <a href="#publications">Publications</a>
        <a href="#about">About</a>
        <a class="nav-cv" href="{{ '/CV_Luiz.pdf' | relative_url }}">CV <span aria-hidden="true">↗</span></a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme" hidden>
        <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/></svg>
        <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
      </button>
    </header>
    <main id="main" class="wrap" tabindex="-1">
      {{ content }}
    </main>
    <footer class="site-footer wrap">
      <p>© {{ 'now' | date: '%Y' }} Luiz Facury</p>
      <a href="#main">Back to top <span aria-hidden="true">↑</span></a>
    </footer>
  </body>
</html>
